[package]
name = "simple_box"
version = "0.1.0"
authors = ["Charles Bournhonesque <charlesbour@gmail.com>"]
edition = "2021"
description = "Examples for the lightyearServer-client networking library for the Bevy game engine"
readme = "README.md"
repository = "https://github.com/cBournhonesque/lightyear"
keywords = ["bevy", "multiplayer", "networking", "netcode", "gamedev"]
categories = ["game-development", "network-programming"]
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["client", "gui", "netcode", "udp"]
client = ["gui", "lightyear_examples_common/client"]
gui = ["lightyear_examples_common/gui"]
netcode = ["lightyear_examples_common/netcode"]
udp = ["lightyear_examples_common/udp"]
# steam = ["lightyear_examples_common/steam"]


[dependencies]
shared = { path = "../shared" }
lightyear = { version = "0.24.2", features = [
  "interpolation",
  "prediction",
  "replication",
  "input_native",
] }
lightyear_examples_common = { path = "../common" }
# serde.workspace = true


bincode = { version = "2.0.1", default-features = false, features = [
  "serde",
  "alloc",
] }
bytes = { version = "1.8", default-features = false, features = ["serde"] }
serde = { version = "1", default-features = false, features = [
  "alloc",
  "derive",
] }


bevy = "0.16"
bevy-inspector-egui = "=0.33.1"
bevy_egui = "0.36.0"
bevy_console = "0.14.1"
